<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <style>
        /* General reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        /* Header Styles */
        header {
            background-color: #003068;
            padding: 2rem 0;
            text-align: center;
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
        }

        /* Hover group for accessibility and better interaction */
        .hover_group:hover {
            opacity: 1;
            cursor: pointer;
        }

        /* Container for the boxes */
        .padded-boxes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            padding: 2rem;
        }

        /* Box styles */
        .padded-boxes > section {
            background: #fff;
            border-radius: .4rem;
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
            width: calc(33.33% - 1rem);
            box-shadow: 0 4px 8px blue;
        }

        /* Headings within the boxes */
        .padded-boxes .heading {
            background: #f97171;
            margin: 0;
            padding: 1rem;
            border-top-left-radius: .4rem;
            border-top-right-radius: .4rem;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
        }

        /* Padded content */
        .padded-boxes .padded {
            padding: 1rem;
            text-align: center;
        }

        /* Hover effect */
        .padded-boxes > section:hover {
            transform: translateY(-10px);
            box-shadow: 0 4px 8px blue;
            background-color: #f1f1f1;
        }

        /* Image style */
        .padded-boxes img {
            height: 200px;
            width: 200px;
            border-radius: 50%;
            transition: transform 0.3s;
            margin-bottom: 1rem;
        }

        .padded-boxes img:hover {
            transform: scale(1.1);
        }

        /* Label styling */
        .padded-boxes label {
            display: block;
            font-weight: bolder;
            margin-top: 1rem;
            font-size: 1rem;
        }

        /* Responsive design */
        @media (max-width: 767px) {
            .padded-boxes > section {
                width: 100%;
            }

            .padded-boxes img {
                height: 150px;
                width: 150px;
            }
        }

        @media (min-width: 768px) and (max-width: 991px) {
            .padded-boxes > section {
                width: calc(50% - 1rem);
            }

            .padded-boxes img {
                height: 180px;
                width: 180px;
            }
        }

        @media (min-width: 992px) {
            .padded-boxes > section {
                width: calc(33.33% - 1rem);
            }
        }
    </style>
</head>

<body>
    <header>
        <span>Pet Care</span>
    </header>

    <main>
        <div class="padded-boxes">
            <section class="hover_group">
                <div class="padded">
                    <a href="Patient_login.html" aria-label="Go to Patient Login">
                        <img src="/patient.jpg.jpeg" class="patient" alt="Patient Login Image"><br>
                        <label>Patient Login</label>
                    </a>
                </div>
            </section>

            <section class="hover_group">
                <div class="padded">
                    <a href="Doctor_login.html" aria-label="Go to Doctor Login">
                        <img src="/doctor.jpg.jpeg" class="doctor" alt="Doctor Login Image"><br>
                        <label>Doctor Login</label>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <footer style="text-align: center; padding: 1rem; background-color: #003068; color: #fff;">
        <p></p>
    </footer>
</body>

</html>
